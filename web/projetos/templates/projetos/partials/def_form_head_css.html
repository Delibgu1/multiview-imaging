

{% load static %}
<style>

:root{
  /* Cores base */
  --mv-green-900:#114722; --mv-green-700:#2b6b3f; --mv-green-600:#3f8b50;
  --mv-green-500:#55a562; --mv-green-300:#80CB2E; --mv-green-200:#cfe9d3;
  --mv-green-100:#eef5e6; --mv-bg:#7aa763; --mv-ink:#1c271c; --mv-ink-2:#415041;

  --mv-gray-900:#111; --mv-gray-700:#545; --mv-gray-500:#8a908a;
  --mv-gray-300:#dfe4df; --mv-gray-200:#edf1ed; --mv-white:#fff;

  /* Feedback */
  --mv-red:#cc3a3a; --mv-yellow:#e0a21c; --mv-blue:#2f6bd8;

  /* Tipografia & espaçamento */
  --mv-r:16px;           /* raio padrão */
  --mv-pad:12px;         /* padding base */
  --mv-gap:12px;         /* gap base */
  --mv-shadow:0 12px 28px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.12);
}

/* Helpers rápidos */
.flex{display:flex} .items-center{align-items:center} .gap-2{gap:8px} .gap-6{gap:16px}



  /* Botão “chip” desativado (mesma cara dos botões inativos atuais) */
  .mv-btn--chip{
    background:#DCE7D4;          /* chip claro */
    color:#A6A6A6;
    border:1px solid rgba(0,0,0,.06);
    box-shadow:none;
    cursor:not-allowed;
    pointer-events:none;
  }
  /* quando virarmos para primário (verde) o pointer volta ao normal: já vem do site.css */

  /* === Sticky-footer neutro nesta página === */
  body.layout-root{ min-height:100vh; display:flex; flex-direction:column; }
  main.mv-main{ flex:1 0 auto; }
  body.layout-root footer.mv-footer{
    position: static !important;
    inset: auto !important; top:auto !important; right:auto !important; bottom:auto !important; left:auto !important;
    z-index: 0 !important; margin-top: 24px;
  }
  footer.mv-footer .mv-footer__band, footer.mv-footer .mv-footer__band--top{ display:none !important; height:0 !important; }

  /* === Área útil === */
  #mvwrap{ max-width:1220px; margin:0 auto; padding:12px 16px 24px; }

  /* === Topbar (cartão à direita) === */
  .mv-topbar{ display:flex; align-items:center; justify-content:flex-end; width:100%; box-sizing:border-box; padding:0; margin:4px 0 8px; }

  /* === Título === */
  .mv-page-title{ text-align:center; font-weight:800; font-size:1.25rem; margin:6px 0 14px; }

  /* === Cards === */
  .mvcard{
    background:#fff; border:1px solid rgba(0,0,0,.06); border-radius:14px;
    padding:22px; margin-bottom:20px;
    box-shadow: inset 0 0 8px rgba(0,0,0,.08), 0 6px 18px rgba(0,0,0,.08);
  }
  .mvcard h3{ margin:0 0 14px; }

  /* === Grid 1→2→3 colunas === */
  /* grades responsivas suaves */
  .mvgrid { display: grid; gap: 12px; }
  .mvgrid.mv-2 { grid-template-columns: 1fr; }
  .mvgrid.mv-3 { grid-template-columns: 1fr; }

  @media (min-width: 900px) {
    .mvgrid.mv-2 { grid-template-columns: 1fr 1fr; }
    .mvgrid.mv-3 { grid-template-columns: 1fr 1fr 1fr; }
  }

  /* helper para esconder apenas visualmente mas manter acessível se precisar */
  .sr-only { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .mvfield{ display:flex; flex-direction:column; gap:6px; }
  .mvfield small{ opacity:.85; }
  .mvfield input[type="text"],
  .mvfield input[type="number"],
  .mvfield input[type="date"],
  .mvfield input[type="datetime-local"],
  .mvfield select,
  .mvfield textarea{
    width:100%; border:1px solid #d9d9d9; border-radius:10px; padding:10px 12px; background:#fff;
  }
  .mvfield textarea{ min-height:120px; resize:vertical; }

  .mv-check{ display:inline-flex; align-items:center; gap:8px; font-weight:600; }
  .errorlist{ margin:4px 0 0; color:#b30000; font-weight:600; list-style:none; padding-left:0; }


/* === Quadro 1 / Objetivo do Projeto (estilos leves) === */
.mv-help { font-size: .92rem; opacity:.85 }
.mv-row    { display:grid; gap:14px 18px; grid-template-columns:1fr }
@media (min-width:720px){ .mv-row{ grid-template-columns:1fr 1fr } }
@media (min-width:1024px){ .mv-row{ grid-template-columns:1fr 1fr 1fr } }

.mv-chip { display:inline-block; padding:6px 10px; border-radius:999px;
  background:#f3f5f4; border:1px solid rgba(0,0,0,.08); margin-right:8px; font-size:.9rem }

.mv-credits { display:flex; gap:16px; align-items:center; margin-top:6px; flex-wrap:wrap }

  padding:10px 14px; box-shadow:0 4px 12px rgba(0,0,0,.06) }
.mv-credits__neg { color:#b91c1c; font-weight:600 }
.mv-credits__ok  { color:#166534; font-weight:600 }

.mv-muted { color:#6b7280 }
.hidden { display:none !important; }

/* ======= Distribuição do Quadro 1 ======= */

/* grid principal do Quadro 1 já é mv-3; criamos spans para campos maiores */
.mv-span-2 { grid-column: span 2; }
.mv-span-3 { grid-column: 1 / -1; }  /* ocupa as 3 colunas */

/* grade interna só para os checkboxes de "Produtos desejados" */
.mv-products-grid{
  display: grid;
  gap: 10px 16px;
  grid-template-columns: 1fr;        /* mobile: 1 col */
  align-items: start;
}
@media (min-width: 720px){
  .mv-products-grid{ grid-template-columns: repeat(2, minmax(0,1fr)); }  /* tablet: 2 col */
}
@media (min-width: 1200px){
  .mv-products-grid{ grid-template-columns: repeat(3, minmax(0,1fr)); }  /* desktop largo: 3 col */
}
.mv-products-grid label{
  display: flex;
  gap: 8px;
  align-items: center;
  line-height: 1.25;
}

/* painel de IV em 2 colunas no desktop, 1 no mobile */
#iv-panel{
  display: grid;
  gap: 12px 18px;
  grid-template-columns: 1fr;        /* mobile */
}
@media (min-width: 960px){
  #iv-panel{ grid-template-columns: 1fr 1fr; }  /* desktop: 2 col */
}
/* a primeira "hint" ocupa toda a largura do painel */
#iv-panel > .mvfield:first-child{ grid-column: 1 / -1; }


/* === Quadro 2 e 3 – Ajustes leves === */
.mvfield .twocol { display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; }
@media (max-width: 760px){ .mvfield .twocol{ grid-template-columns:1fr; } }

.mvfield .mv-sm { font-size:12px; color:#666; }
.mvfield input[type="file"] { padding:8px; background:#fff; border:1px solid #e5e7eb; border-radius:10px; }
.mv-sep { height:1px; background:rgba(0,0,0,.06); margin:8px 0 4px; }

.mv-colhelp { display:flex; gap:10px; align-items:center; color:#4a5568; }
.mv-colhelp code { background:#f3f4f6; padding:2px 6px; border-radius:6px; }


/* === Botões inferiores (usar apenas .mv-btn do site.css) === */
.mv-actions{
  display:flex; gap:18px; justify-content:flex-start; align-items:center;
  margin:22px 0 6px;
}

/* Força tamanho/align iguais para todos os botões */
.mv-actions .mv-btn{

  gap:12px;
  height:56px;                /* mesma altura para todos */

}

/* Ícones alinhados e do mesmo tamanho */
.mv-actions .mv-btn > img{
  width:22px; height:22px; display:block;
}
/* Ícone ~20% menor só no Cancelar (vence a regra .mv-actions .mv-btn > img) */
#btn-cancelar > img.mv-btn__icon--sm {

  height: 18px !important;
}


/* === Quadro 1: Objetivo do Projeto === */
.mvcard h3 .mv-badge{ font-size:12px; font-weight:600; margin-left:8px; padding:2px 8px; border-radius:999px; background:#eef5e6; color:#3e7e14; }

.mvfield small.mv-hint{ color:#666; display:block; margin-top:4px; line-height:1.3; }

.mv-tag{ display:inline-block; font-size:12px; line-height:1; padding:4px 8px; border-radius:999px; margin-left:8px;
           background:#fde2e1; color:#7a1b1b; border:1px solid #f7b1ad; } /* label de obrigatório */

.mv-iv-group { margin: 8px 0 0 0; padding: 8px 10px; border-left: 3px solid #e5e7eb; }

.mv-credits{

#q5-creditos strong{font-weight:600}

/* ===== Tipografia dos labels (opções x títulos) ===== */

/* Por padrão, labels na página ficam com peso normal */
.mvcard label { font-weight: 400 !important; }

/* Títulos dos campos (o label DIRETO dentro do bloco) ficam em negrito */

<style>
  /* ===== Grid utilitário para formulários ===== */
  .form-grid { display: grid; gap: 16px; align-items: start; }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  /* Spans rápidos */
  .span-2 { grid-column: span 2 / span 2; }
  .span-3 { grid-column: 1 / -1; }

  /* Responsivo:  ≥1024px = 3 col; 720–1023px = 2 col; <720px = 1 col */
  @media (max-width: 1023.98px) {
    .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 719.98px) {
    .grid-3 { grid-template-columns: 1fr; }
    .span-2, .span-3 { grid-column: 1 / -1; }
  }

  /* Mantém grupos (checkbox/radio) visualmente coesos dentro da célula */
  .field-group { background: #fff; border: 1px solid #e6e6e6; border-radius: 8px; padding: 12px; }
  .field-group .group-title { font-weight: 600; margin-bottom: 8px; }
</style>

<style>

  /* Normaliza espaçamento interno de cada célula */

  .mvfield > select,
  .mvfield > input[type="text"],

  font-size:  1.3rem;  /* um passo acima do padrão */

    width:24px; height:24px; border-radius:999px;
    border:1px solid #cfe4c4; background:#f7fbf5; line-height:0;
